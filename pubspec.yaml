name: myrsu
description: "MyRSU - student timetable & course companion app for RSU, built with Flutter Web + Firebase."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.4

  # State management & persistence
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  file_picker: ^8.1.2 # cross-platform native file/image picker (Android, iOS, Windows, macOS, Linux, Web)
  table_calendar: ^3.1.2 # month calendar widget for the Personal tab

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
